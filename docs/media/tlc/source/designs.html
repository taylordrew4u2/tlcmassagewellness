<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TLC Media Kit — editable artwork</title>
<style>
@font-face{font-family:Cormorant;src:url('fonts/cormorant-garamond-latin-400.woff2')}@font-face{font-family:Jost;src:url('fonts/jost-latin-400.woff2')}
:root{--green:#2f3b2a;--gold:#a89240;--cream:#f7f3e8;--line:#d8d6c6;--soft:#dfe4d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--green);font-family:Jost,sans-serif}#art{position:relative;overflow:hidden;width:1920px;height:1080px;background:var(--cream)}h1,h2,p{margin:0}h1,h2{font-family:Cormorant,serif;font-weight:400;line-height:.96;letter-spacing:-.025em}.eyebrow{font-size:21px;letter-spacing:.2em;text-transform:uppercase;color:#827239}.body{font-size:30px;line-height:1.5;color:#58634f}.brand{display:flex;align-items:center;gap:22px}.brand svg{width:110px;height:66px;fill:var(--gold)}.brand b{font:400 38px Cormorant,serif;display:block;line-height:1}.brand small{display:block;font-size:15px;letter-spacing:.27em;text-transform:uppercase;margin-top:10px}.top{position:absolute;left:96px;right:96px;top:64px;display:flex;align-items:center;justify-content:space-between}.footer{position:absolute;bottom:54px;left:96px;right:96px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:25px;font-size:22px}.screen{overflow:hidden;border:1px solid #c9cebf;border-radius:15px;background:var(--cream);box-shadow:0 22px 55px #1c291523}.screen .chrome{height:32px;border-bottom:1px solid #d4d8cb;display:flex;align-items:center;gap:7px;padding:0 16px;background:#f0eee4}.chrome i{display:block;width:6px;height:6px;border-radius:50%;background:#a5ab9a}.screen img{display:block;width:100%}.phone{position:absolute;background:#273123;padding:9px;border-radius:34px;box-shadow:0 20px 45px #1c29152e}.phone img{width:100%;display:block;border-radius:25px}.rule{height:1px;background:var(--gold);width:100px}.tag{display:inline-block;border:1px solid #a8924080;border-radius:999px;padding:15px 28px;font-size:20px;letter-spacing:.06em}.tiny{font-size:18px;letter-spacing:.03em;color:#68725e}.dark{background:var(--green)!important;color:var(--cream)}.dark .body{color:#dce1d4}.dark .footer{border-color:#748068}.dark .eyebrow{color:#d5c387}.dark .brand small{color:#d5c387}.num{font-family:Cormorant,serif;color:var(--gold);font-size:44px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}.steps p{font-size:25px;margin-top:10px}.photo{position:absolute;object-fit:cover}.button{display:inline-block;border:1px solid var(--gold);padding:18px 34px;border-radius:999px;font-size:21px;letter-spacing:.06em}.caption{font-size:18px;position:absolute;bottom:28px;left:96px;color:#6f7866}.vertical .top{left:88px;right:88px;top:120px}.vertical .brand svg{width:110px}.vertical .brand b{font-size:42px}.vertical .brand small{font-size:16px}.vertical .footer{left:88px;right:88px;bottom:180px;display:block;font-size:24px}.vertical .footer span{display:block;margin-top:18px}.vertical .screen{border-radius:22px}.vertical .chrome{height:38px}.vertical .body{font-size:36px}.vertical .eyebrow{font-size:24px}.vertical h1{font-size:112px}.vhead{position:absolute;left:88px;right:88px;top:320px}.vscreen{position:absolute;left:70px;right:70px;top:750px}.vscreen img{width:100%}.vnote{position:absolute;left:88px;right:88px;bottom:200px;font-size:29px;line-height:1.5}.vshot{position:absolute;left:88px;top:720px;width:904px;height:920px;overflow:hidden}.vshot img{width:100%}.vphoto{position:absolute;left:0;bottom:0;width:1080px;height:920px;object-fit:cover;object-position:center 70%}.sectionnumber{font-size:20px;letter-spacing:.2em}.credit{font-size:16px;letter-spacing:.04em;color:#7c806c}
</style></head><body><main id="art"></main>
<script>
(()=>{
const p=new URLSearchParams(location.search),type=p.get('type')||'portfolio-cover',portrait=p.get('format')==='portrait',slide=+(p.get('slide')||0),art=document.querySelector('#art');
function butterflies(){return `<svg viewBox="0 0 176 76" aria-hidden="true">${[[26,57,.55],[80,38,.8],[142,20,1]].map(([x,y,s])=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-1.5-9 C-7-19 -17-18 -18-9 C-19 0 -10 4 -2 0 Z M1.5-9 C7-19 17-18 18-9 C19 0 10 4 2 0 Z M-1.5 1 C-8 2 -12 8 -9 14 C-6 19 -1 16 -1.5 9 Z M1.5 1 C8 2 12 8 9 14 C6 19 1 16 1.5 9 Z"/><rect x="-.6" y="-13" width="1.2" height="29" rx=".6" fill="#56684d"/></g>`).join('')}</svg>`}
function brand(){return `<div class="brand">${butterflies()}<div><b>TLC</b><small>Massage Wellness</small></div></div>`}
function top(label='PORTFOLIO / WEB DEVELOPMENT'){return `<div class="top">${brand()}<div class="eyebrow">${label}</div></div>`}
function screen(name,style='',imgStyle=''){return `<div class="screen" style="${style}"><div class="chrome"><i></i><i></i><i></i></div><img src="../screenshots/${name}.png" alt="Actual TLC local demo interface" style="${imgStyle}"></div>`}
function footer(){return `<div class="footer"><span>TLC Massage Wellness</span><span>Next.js · React · TypeScript · Tailwind CSS</span></div>`}
function cover(){return `${top()}<div style="position:absolute;left:96px;top:282px;width:680px"><div class="eyebrow">A calm first impression</div><h1 style="font-size:112px;margin-top:32px">Wellness,<br>thoughtfully<br>presented.</h1><p class="body" style="margin-top:36px;width:610px">A welcoming website.<br>Practical controls for the owner.</p></div>${screen('desktop-home','position:absolute;left:810px;top:235px;width:1000px')}<div class="phone" style="left:1518px;top:449px;width:254px"><img src="../screenshots/mobile-home.png" alt="TLC phone homepage"></div>${footer()}`}
function feature(n){const title=n===2?'A clear next step.':n===3?'Review.<br>Accept.<br>Complete.':'Keep the<br>website yours.';const body=n===2?'Choose a treatment.<br>Request a preferred date and time.':n===3?'An owner-managed workflow<br>for every appointment request.':'Edit copy, photos, treatments<br>and practitioner profiles.';const file=n===2?'desktop-booking':n===3?'admin-bookings':'admin-website';return `${top(n===2?'THE VISITOR EXPERIENCE':'THE OWNER EXPERIENCE')}<div style="position:absolute;left:96px;top:290px;width:650px"><div class="eyebrow">0${n-1} / ${n===2?'REQUEST':n===3?'MANAGE':'MAKE IT YOURS'}</div><h1 style="font-size:112px;margin-top:35px">${title}</h1><p class="body" style="margin-top:40px">${body}</p></div>${screen(file,'position:absolute;left:790px;top:240px;width:1030px;height:700px',n===2?'margin-top:-100px':'')}<div class="caption">Actual interface · Local demo · Fictional sample data</div>`}
function ending(){return `${top('EXPLORE THE PROJECT')}<div style="position:absolute;left:96px;top:300px;width:1050px"><div class="eyebrow">TLC Massage Wellness</div><h1 style="font-size:128px;margin-top:30px">Care on the surface.<br>Control behind it.</h1><p class="body" style="margin-top:44px">Discover the design and the code.</p><div class="button" style="margin-top:38px">View on GitHub ↗</div><p style="font-size:24px;margin-top:32px">github.com/taylordrew4u2/tlcmassagewellness</p></div><img class="photo" src="../images/wellness-detail.png" style="right:0;top:0;width:660px;height:1080px;object-position:center 70%" alt="Conceptual wellness still life"><div style="position:absolute;right:0;bottom:0;padding:25px 36px;background:#2f3b2acc;color:#f7f3e8;width:660px;font-size:16px">Conceptual brand photography</div>`}
function vslide(n){if(n===1)return `${top('')}<div class="vhead"><div class="eyebrow">TLC Massage Wellness</div><h1 style="margin-top:30px">Wellness,<br>thoughtfully<br>presented.</h1></div><div class="phone" style="left:340px;top:800px;width:400px"><img src="../screenshots/mobile-home.png" alt="TLC mobile homepage"></div><div class="vnote" style="bottom:145px;text-align:center">A calm website. Practical owner controls.</div>`;if(n===5)return `${top('')}<div class="vhead"><div class="eyebrow">Explore the project</div><h1 style="font-size:115px;margin-top:35px">Care on the surface.<br>Control behind it.</h1><p class="body" style="margin-top:40px">TLC Massage Wellness</p></div><div class="rule" style="position:absolute;top:995px;left:88px"></div><p style="position:absolute;top:1050px;left:88px;font-size:34px;line-height:1.7">Next.js · React · TypeScript<br>Tailwind CSS</p><div style="position:absolute;left:88px;top:1325px"><div class="button" style="font-size:29px">View on GitHub ↗</div><p style="font-size:29px;line-height:1.6;margin-top:40px">github.com/taylordrew4u2/<br>tlcmassagewellness</p></div><div style="position:absolute;right:110px;bottom:120px;width:240px;opacity:.5">${butterflies()}</div>`;const title=n===2?'A clear<br>next step.':n===3?'Review. Accept.<br>Complete.':'Keep the<br>website yours.';const body=n===2?'Send an appointment request.':n===3?'Manage each request in one place.':'Edit content, treatments and profiles.';const shot=n===2?'desktop-booking':n===3?'admin-bookings-portrait':'admin-website-portrait';return `${top('')}<div class="vhead"><div class="eyebrow">0${n-1} / ${n===2?'Request':n===3?'Manage':'Make it yours'}</div><h1 style="margin-top:34px">${title}</h1><p class="body" style="margin-top:38px">${body}</p></div>${screen(shot,'position:absolute;left:70px;top:800px;width:940px;height:830px',n===2?'width:1300px;margin-left:-180px;margin-top:-170px':'')}<div class="vnote" style="font-size:24px;bottom:170px">Actual interface · Local demo<br>Fictional sample data</div>`}
let content='';
if(type==='readme-banner'){art.style.width='1600px';art.style.height='800px';art.className='dark';content=`<img class="photo" src="../images/wellness-room.png" style="right:0;top:0;width:735px;height:800px;object-position:70% center" alt="Conceptual treatment room"><div style="position:absolute;inset:0 auto 0 0;width:865px;background:var(--green)"></div><div style="position:absolute;left:72px;top:60px">${brand()}</div><div style="position:absolute;left:72px;top:265px;width:760px"><div class="eyebrow">TLC Massage Wellness</div><h1 style="font-size:86px;margin-top:28px">A calm website.<br>Practical<br>owner controls.</h1><p style="font-size:24px;margin-top:40px;color:#dce1d4">Appointment requests · Editable content</p></div><div style="position:absolute;left:72px;bottom:45px;font-size:18px;letter-spacing:.06em;color:#d5c387">NEXT.JS · REACT · TYPESCRIPT · TAILWIND CSS</div><div style="position:absolute;right:24px;bottom:24px;font-size:14px;background:#f7f3e8dd;padding:10px 15px;color:#2f3b2a">Conceptual brand imagery</div>`}
else if(type==='portfolio-cover')content=cover();
else if(type==='request-flow'){content=`${top('APPOINTMENT REQUEST WORKFLOW')}<div style="position:absolute;left:96px;top:205px"><div class="eyebrow">Designed around real practice needs</div><h1 style="font-size:86px;margin-top:25px">From request to a confirmed visit.</h1></div>${screen('booking-form','position:absolute;left:96px;top:400px;width:816px;height:450px','height:370px;width:auto;margin:24px auto')}${screen('admin-bookings','position:absolute;left:1008px;top:400px;width:816px;height:450px')}<div class="steps" style="position:absolute;left:96px;right:96px;bottom:76px"><div><span class="num">01</span><p>Choose a treatment</p></div><div><span class="num">02</span><p>Send an appointment request</p></div><div><span class="num">03</span><p>The owner reviews and confirms</p></div></div><div class="credit" style="position:absolute;right:96px;top:358px">Local demo · Fictional sample data</div>`}
else if(type==='social-square'){art.style.width='1080px';art.style.height='1080px';content=`<div style="position:absolute;left:72px;right:72px;top:64px">${brand()}<div style="height:1px;background:var(--gold);margin-top:48px"></div></div><div style="position:absolute;left:72px;top:280px"><h1 style="font-size:112px">A little time,<br>just for you.</h1><p class="body" style="font-size:28px;margin-top:32px">Explore massage and wellness treatments.</p><div class="button" style="margin-top:30px">Request an appointment</div></div><img class="photo" src="../images/wellness-detail.png" alt="Conceptual wellness detail" style="left:0;top:710px;width:1080px;height:370px;object-position:center 65%"><div style="position:absolute;left:72px;bottom:25px;font-size:15px;color:var(--cream)">TLC Massage Wellness · Conceptual brand imagery</div>`}
else if(type==='social-portrait'){art.style.width='1080px';art.style.height='1350px';content=`<img class="photo" src="../images/wellness-detail.png" alt="Conceptual wellness detail" style="inset:0;width:1080px;height:1350px"><div style="position:absolute;inset:0;background:linear-gradient(#f7f3e866,transparent 65%)"></div><div style="position:absolute;left:72px;top:60px">${brand()}</div><div style="position:absolute;left:72px;right:72px;top:260px"><div class="eyebrow" style="color:var(--green)">TLC Massage Wellness</div><h1 style="font-size:114px;margin-top:28px">Make room for<br>a calmer moment.</h1></div><div style="position:absolute;bottom:0;left:0;right:0;padding:40px 72px;background:var(--green);color:var(--cream);display:flex;align-items:center;justify-content:space-between"><div><p style="font-size:27px">Explore treatments.</p><p style="font-size:15px;margin-top:12px;color:#d5c387">Conceptual brand imagery</p></div><div class="button" style="font-size:24px">Request a visit ↗</div></div>`}
else if(type==='video'){if(portrait){art.style.width='1080px';art.style.height='1920px';art.className='vertical'+(slide===5?' dark':'');content=vslide(slide)}else{art.className=slide===5?'dark':'';content=slide===1?cover():slide===5?ending():feature(slide)}}
art.innerHTML=content;
})();
</script></body></html>
